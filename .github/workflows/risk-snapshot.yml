name: Nightly risk snapshot

# After each US market close, refresh data/risk-snapshot.json for the risk engine page.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: risk-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the snapshot
        run: python scripts/risk_snapshot.py data/risk-snapshot.json
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- data/risk-snapshot.json; then echo "No new trading day"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk-snapshot.json
          git commit -m "Risk snapshot for $(date -u +%F)"
          git push
